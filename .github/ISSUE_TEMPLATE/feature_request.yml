name: Feature request
description: Suggest an improvement. Please read the scope in CONTRIBUTING.md first.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the question you can't answer with Tinylytics today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This doesn't require collecting more data about visitors, or I've explained why it's still privacy-friendly.
          required: true
