name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security issues, please use [private reporting](https://github.com/App-Chef/Tinylytics/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the tracker on a Next.js site
        2. Navigate from / to /pricing
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tracker
        - Ingestion API
        - Dashboard
        - Authentication
        - Self-hosting / setup
        - Documentation
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Hosted or self-hosted? Browser, framework and version if relevant.
