name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w tracker
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tinylytics.app

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners ship PostgreSQL binaries; the script starts a throwaway
      # cluster, applies a Supabase stub, the migrations and the seed.
      - run: bash supabase/tests/run.sh
        env:
          TMPDIR: ${{ runner.temp }}
